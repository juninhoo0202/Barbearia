{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nova Senha - Barbearia Estilo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body { background: linear-gradient(135deg, rgba(25,135,84,0.7), rgba(40,167,69,0.7)),
      url("{% static 'img/barbearia-bg.jpg' %}") center/cover no-repeat;
      min-height:100vh; display:flex; justify-content:center; align-items:center; }
    .card-glass { background: rgba(255,255,255,0.12); backdrop-filter: blur(20px);
      padding: 2rem; border-radius: 1rem; max-width: 400px; width:100%; color:white; }
    .form-control { background: rgba(255,255,255,0.15); border:none; color:white; }
    .btn-success { width:100%; margin-top:1rem; background: linear-gradient(45deg, #198754, #28a745); border:none; }
  </style>
</head>
<body class="site-auth">
  {% include "barbearia/partials/site_chrome.html" %}

  <main class="site-auth-page">
  <div class="card-glass">
    <h2><i class="fas fa-key"></i> Definir Nova Senha</h2>
    <form method="POST">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-success">Salvar Nova Senha</button>
    </form>
  </div>
  </main>
</body>
</html>
