{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Senha Redefinida - Barbearia Estilo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body { background: linear-gradient(135deg, #28a745, #198754); min-height:100vh;
      display:flex; justify-content:center; align-items:center; }
    .card-glass { background: rgba(255,255,255,0.12); backdrop-filter: blur(20px);
      padding: 2rem; border-radius: 1rem; max-width: 400px; color:white; text-align:center; }
    .btn-success { background:#198754; border:none; margin-top:1rem; }
  </style>
</head>
<body class="site-auth">
  {% include "barbearia/partials/site_chrome.html" %}

  <main class="site-auth-page">
  <div class="card-glass">
    <h2><i class="fas fa-check-circle"></i> Senha Redefinida</h2>
    <p>Sua senha foi redefinida com sucesso. Agora você pode fazer login com a nova senha.</p>
    <a href="{% url 'login' %}" class="btn btn-success">Ir para o Login</a>
  </div>
  </main>
</body>
</html>
