{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redefinir Senha - Barbearia Estilo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body {
      background: linear-gradient(135deg, rgba(25,135,84,0.7), rgba(40,167,69,0.7)),
                  url("{% static 'img/barbearia-bg.jpg' %}") center/cover no-repeat;
      min-height: 100vh; display: flex; justify-content: center; align-items: center;
      font-family: 'Poppins', sans-serif; padding: 1rem;
    }
    .card-glass {
      background: rgba(255,255,255,0.12); backdrop-filter: blur(20px);
      padding: 2rem; border-radius: 1rem; box-shadow: 0 15px 35px rgba(0,0,0,0.3);
      max-width: 400px; width: 100%; text-align: center; color: white;
    }
    .card-glass h2 { margin-bottom: 1.5rem; font-weight: bold; }
    .form-control {
      background: rgba(255,255,255,0.15); border: none; color: white;
    }
    .form-control::placeholder { color: rgba(255,255,255,0.7); }
    .btn-success {
      width: 100%; margin-top: 1rem; font-weight: bold;
      background: linear-gradient(45deg, #198754, #28a745); border: none;
      transition: background-color 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }
    .btn-success:hover { transform: none; }
  </style>
</head>
<body class="site-auth">
  {% include "barbearia/partials/site_chrome.html" %}

  <main class="site-auth-page">
  <div class="card-glass">
    <h2><i class="fas fa-unlock-alt"></i> Redefinir Senha</h2>
    <form method="POST">
      {% csrf_token %}
      <div class="mb-3">
        <input type="email" name="email" class="form-control" placeholder="Digite seu e-mail" required>
      </div>
      <button type="submit" class="btn btn-success">Enviar link de redefinição</button>
    </form>
    <a href="{% url 'login' %}" class="d-block mt-3 text-light">Voltar ao Login</a>
  </div>
  </main>
</body>
</html>
